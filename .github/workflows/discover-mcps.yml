name: Discover new MCPs

on:
  schedule:
    - cron: '0 9 * * 6'  # Sábados a las 9am UTC
  workflow_dispatch:

jobs:
  discover:
    name: Discover trending MCPs
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Discover MCPs from curated sources
        id: discover
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module << 'EOF'
          import { readFileSync, readdirSync, writeFileSync } from 'node:fs';

          // Leer MCPs existentes en el catálogo
          const existing = new Set(
            readdirSync('./content/mcps')
              .filter(f => f.endsWith('.md'))
              .map(f => f.replace('.md', ''))
          );

          const headers = {
            Authorization: `token ${process.env.GITHUB_TOKEN}`,
            Accept: 'application/vnd.github.v3+json',
            'User-Agent': 'DevSkills-MCP-Discovery',
          };

          // Topics que indican que NO es un servidor instalable
          const excludeTopics = new Set([
            'mcp-client', 'mcp-host', 'mcp-gateway', 'mcp-middleware',
            'mcp-inspector', 'mcp-hub', 'mcp-registry',
            'neovim', 'nvim', 'neovim-plugin', 'nvim-plugin',
            'vscode-extension', 'jetbrains-plugin',
          ]);

          // Keywords en nombre o descripción que indican tutorial/framework/cliente
          const excludeKeywords = [
            'beginner', 'tutorial', 'curriculum', 'introduction to',
            'learn ', 'course', 'example', 'sample', 'demo',
            'framework', 'orchestrat', 'aggregat', 'gateway',
            'client sdk', 'client library', 'client for ',
            'manage your mcp', 'manage & connect', 'one place to manage',
            'fullstack mcp', 'mcp apps for',
          ];

          function isRealServer(repo) {
            const topics = repo.topics ?? [];
            const name = repo.name.toLowerCase();
            const desc = (repo.description ?? '').toLowerCase();
            const combined = name + ' ' + desc;

            // Excluir si tiene topics de cliente/gateway/plugin
            if (topics.some(t => excludeTopics.has(t))) return false;

            // Excluir si nombre o descripción contiene keywords de exclusión
            if (excludeKeywords.some(kw => combined.includes(kw))) return false;

            // Excluir si el nombre sugiere que es un cliente o plugin de editor
            if (/\.(nvim|vim)$/.test(name)) return false;
            if (name.includes('-client') && !name.includes('-mcp')) return false;

            return true;
          }

          // Fuente 1: GitHub Search — topic:mcp-server, ordenado por stars
          const ghRes = await fetch(
            'https://api.github.com/search/repositories?q=topic:mcp-server&sort=stars&order=desc&per_page=40',
            { headers }
          );
          const ghData = await ghRes.json();
          const ghRepos = ghData.items ?? [];

          // Fuente 2: MCP Registry oficial
          let registryRepos = [];
          try {
            const regRes = await fetch(
              'https://registry.modelcontextprotocol.io/api/v1/servers?limit=50&sort=stars',
              { headers: { 'User-Agent': 'DevSkills-MCP-Discovery' } }
            );
            if (regRes.ok) {
              const regData = await regRes.json();
              const servers = regData.servers ?? regData.items ?? regData.data ?? [];
              // Convertir al mismo shape que GitHub repos
              for (const s of servers) {
                const repoUrl = s.repository?.url ?? s.github_url ?? s.url ?? '';
                if (!repoUrl.includes('github.com')) continue;
                const match = repoUrl.match(/github\.com\/([^/]+\/[^/]+)/);
                if (!match) continue;
                registryRepos.push({
                  full_name: match[1].replace(/\.git$/, ''),
                  html_url: `https://github.com/${match[1].replace(/\.git$/, '')}`,
                  name: match[1].split('/')[1].replace(/\.git$/, ''),
                  stargazers_count: s.stars ?? s.stargazers_count ?? 0,
                  description: s.description ?? '',
                  topics: s.topics ?? [],
                });
              }
            }
          } catch (e) {
            console.log('Registry API no disponible:', e.message);
          }

          // Combinar fuentes, deduplicar por full_name
          const seen = new Set();
          const allRepos = [];
          for (const r of [...ghRepos, ...registryRepos]) {
            if (!seen.has(r.full_name)) {
              seen.add(r.full_name);
              allRepos.push(r);
            }
          }

          // Filtrar: servidor real, >500 stars, no en catálogo
          const candidates = allRepos
            .filter(r => r.stargazers_count >= 500)
            .filter(isRealServer)
            .filter(r => {
              const id = r.name.toLowerCase().replace(/[^a-z0-9-]/g, '-');
              return !existing.has(id) && !existing.has(r.name.toLowerCase());
            })
            .sort((a, b) => b.stargazers_count - a.stargazers_count)
            .map(r => ({
              name: r.full_name,
              url: r.html_url,
              stars: r.stargazers_count,
              description: r.description ?? '',
              topics: r.topics ?? [],
            }));

          if (candidates.length === 0) {
            console.log('No se encontraron nuevos MCPs candidatos esta semana.');
            process.exit(0);
          }

          writeFileSync('mcp-candidates.json', JSON.stringify(candidates, null, 2));
          console.log(`${candidates.length} candidatos encontrados (filtrados de ${allRepos.length} repos).`);
          EOF

      - name: Create GitHub Issue with suggestions
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module << 'EOF'
          import { readFileSync, existsSync } from 'node:fs';

          if (!existsSync('mcp-candidates.json')) process.exit(0);

          const candidates = JSON.parse(readFileSync('mcp-candidates.json', 'utf8'));
          if (candidates.length === 0) process.exit(0);

          const today = new Date().toISOString().split('T')[0];

          const body = `## Nuevos MCPs candidatos detectados — ${today}

          Los siguientes repositorios tienen más de 500 estrellas y no están en el catálogo.
          **Revisión manual requerida antes de agregar.**

          ${candidates.map(c => `
          ### [${c.name}](${c.url})
          - **Estrellas:** ⭐ ${c.stars.toLocaleString()}
          - **Descripción:** ${c.description}
          - **Topics:** ${c.topics.join(', ') || '—'}
          `).join('\n')}

          ---
          *Generado automáticamente por el workflow discover-mcps.yml*
          *Fuentes: GitHub Search API (topic:mcp-server), MCP Registry oficial*`;

          const res = await fetch(
            `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/issues`,
            {
              method: 'POST',
              headers: {
                Authorization: `token ${process.env.GITHUB_TOKEN}`,
                'Content-Type': 'application/json',
                'User-Agent': 'DevSkills-MCP-Discovery',
              },
              body: JSON.stringify({
                title: `[Discovery] ${candidates.length} nuevos MCPs candidatos — ${today}`,
                body,
                labels: ['mcp-discovery', 'needs-review'],
              }),
            }
          );

          if (res.ok) {
            const issue = await res.json();
            console.log(`Issue creado: ${issue.html_url}`);
          } else {
            console.error('Error creando issue:', await res.text());
          }
          EOF
